```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>🌍 ブロックワールド</title>

<style>
*{
    box-sizing:border-box;
    touch-action:none;
}

body{
    margin:0;
    background:#87ceeb;
    font-family:sans-serif;
    overflow:hidden;
    text-align:center;
}

#game{
    display:block;
    margin:auto;
    background:#87ceeb;
    border:2px solid #222;
    width:100vw;
    max-width:900px;
    height:auto;
}

#info{
    position:fixed;
    top:5px;
    left:5px;
    z-index:10;
    background:rgba(0,0,0,.55);
    color:white;
    padding:7px;
    border-radius:10px;
    font-size:14px;
    text-align:left;
}

#message{
    position:fixed;
    top:5px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    color:white;
    background:rgba(0,0,0,.55);
    padding:6px 12px;
    border-radius:10px;
}

#buttons{
    position:fixed;
    bottom:8px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    display:flex;
    gap:6px;
    align-items:center;
}

button{
    border:0;
    border-radius:12px;
    padding:10px 14px;
    font-size:18px;
    font-weight:bold;
}

.move{
    background:#405a75;
    color:white;
}

.action{
    background:#f0c52b;
}

#pad{
    position:fixed;
    left:10px;
    bottom:10px;
    z-index:20;
    display:grid;
    grid-template-columns:55px 55px 55px;
    grid-template-rows:50px 50px;
    gap:3px;
}

#up{
    grid-column:2;
}

#left{
    grid-column:1;
    grid-row:2;
}

#down{
    grid-column:2;
    grid-row:2;
}

#right{
    grid-column:3;
    grid-row:2;
}

#actions{
    position:fixed;
    right:10px;
    bottom:10px;
    z-index:20;
    display:flex;
    flex-direction:column;
    gap:6px;
}

@media(max-width:600px){
    button{
        padding:9px 11px;
        font-size:16px;
    }

    #info{
        font-size:12px;
    }
}
</style>
</head>

<body>

<div id="info">
❤️ HP: <span id="hp">10</span><br>
🎒 ブロック: <span id="blockCount">20</span><br>
🌞 時間: <span id="day">昼</span>
</div>

<div id="message">
🌍 ブロックワールドへようこそ！
</div>

<canvas id="game"
        width="900"
        height="600">
</canvas>


<!-- スマホ移動 -->

<div id="pad">

<button class="move" id="up">⬆️</button>
<button class="move" id="left">⬅️</button>
<button class="move" id="down">⬇️</button>
<button class="move" id="right">➡️</button>

</div>


<!-- 操作 -->

<div id="actions">

<button class="action" id="breakBtn">
⛏️ 壊す
</button>

<button class="action" id="placeBtn">
🧱 置く
</button>

<button class="action" id="saveBtn">
💾 保存
</button>

</div>


<script>

/* =========================
   設定
========================= */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");


const TILE=40;

const WORLD_W=60;
const WORLD_H=40;


/* =========================
   世界
========================= */

let world=[];

for(let y=0;y<WORLD_H;y++){

    world[y]=[];

    for(let x=0;x<WORLD_W;x++){

        if(y<18){

            world[y][x]=0;

        }else if(y===18){

            world[y][x]=1;

        }else if(y<22){

            world[y][x]=2;

        }else{

            world[y][x]=3;
        }
    }
}


/* =========================
   木
========================= */

for(let i=0;i<35;i++){

    let x=
    2+
    Math.floor(
        Math.random()*(WORLD_W-4)
    );

    let y=17;

    world[y][x]=4;
    world[y-1][x]=4;
    world[y-2][x]=5;
    world[y-3][x]=5;
}


/* =========================
   石
========================= */

for(let i=0;i<80;i++){

    let x=
    Math.floor(
        Math.random()*WORLD_W
    );

    let y=
    23+
    Math.floor(
        Math.random()*15
    );

    if(y<WORLD_H){

        world[y][x]=6;
    }
}


/* =========================
   プレイヤー
========================= */

let player={
    x:10,
    y:15,
    hp:10
};


let blocks=20;

let cameraX=0;
let cameraY=0;

let dayTime=0;

let enemies=[];


/* =========================
   ブロック情報
========================= */

const blockNames={
    0:"空気",
    1:"草",
    2:"土",
    3:"石",
    4:"木",
    5:"葉っぱ",
    6:"石炭石"
};


/* =========================
   描画
========================= */

function drawBlock(
    type,
    x,
    y
){

    if(type===0)return;


    if(type===1){

        ctx.fillStyle="#55aa35";
        ctx.fillRect(
            x,y,TILE,TILE
        );

        ctx.fillStyle="#75d64c";
        ctx.fillRect(
            x,y,TILE,8
        );
    }


    if(type===2){

        ctx.fillStyle="#9b5d35";
        ctx.fillRect(
            x,y,TILE,TILE
        );
    }


    if(type===3){

        ctx.fillStyle="#777";
        ctx.fillRect(
            x,y,TILE,TILE
        );

        ctx.fillStyle="#999";

        ctx.fillRect(
            x+7,y+8,7,7
        );

        ctx.fillRect(
            x+25,y+20,6,6
        );
    }


    if(type===4){

        ctx.fillStyle="#7a4b24";
        ctx.fillRect(
            x,y,TILE,TILE
        );

        ctx.fillStyle="#9b652e";

        ctx.fillRect(
            x+8,y,5,TILE
        );
    }


    if(type===5){

        ctx.fillStyle="#2e9e3f";
        ctx.fillRect(
            x,y,TILE,TILE
        );

        ctx.fillStyle="#42c954";

        ctx.fillRect(
            x+7,y+7,10,10
        );
    }


    if(type===6){

        ctx.fillStyle="#666";
        ctx.fillRect(
            x,y,TILE,TILE
        );

        ctx.fillStyle="#222";

        ctx.fillRect(
            x+8,y+8,7,7
        );

        ctx.fillRect(
            x+25,y+24,6,6
        );
    }


    ctx.strokeStyle=
    "rgba(0,0,0,.15)";

    ctx.strokeRect(
        x,y,TILE,TILE
    );
}


/* =========================
   プレイヤー
========================= */

function drawPlayer(){

    const x=
    player.x*TILE-
    cameraX;

    const y=
    player.y*TILE-
    cameraY;


    ctx.fillStyle="#2675d8";

    ctx.fillRect(
        x+7,
        y+4,
        26,
        34
    );


    ctx.fillStyle="#ffd0a0";

    ctx.fillRect(
        x+9,
        y-9,
        22,
        22
    );


    ctx.fillStyle="#5b351d";

    ctx.fillRect(
        x+8,
        y-11,
        24,
        8
    );
}


/* =========================
   敵
========================= */

function spawnEnemy(){

    enemies.push({

        x:
        player.x+
        (Math.random()<.5?-8:8),

        y:17,

        hp:3,

        speed:.02
    });
}


function drawEnemies(){

    for(const e of enemies){

        const x=
        e.x*TILE-
        cameraX;

        const y=
        e.y*TILE-
        cameraY;


        ctx.fillStyle="#36a852";

        ctx.fillRect(
            x+5,
            y+5,
            30,
            32
        );


        ctx.fillStyle="#111";

        ctx.fillRect(
            x+11,
            y+13,
            5,
            5
        );

        ctx.fillRect(
            x+25,
            y+13,
            5,
            5
        );
    }
}


/* =========================
   世界描画
========================= */

function drawWorld(){

    ctx.clearRect(
        0,0,
        canvas.width,
        canvas.height
    );


    /* 空 */

    ctx.fillStyle=
    dayTime<3000
    ?" #87ceeb"
    :"#18233f";

    ctx.fillStyle=
    dayTime<3000
    ?" #87ceeb"
    :"#18233f";

    ctx.fillRect(
        0,0,
        canvas.width,
        canvas.height
    );


    /* ブロック */

    const startX=
    Math.floor(cameraX/TILE)-1;

    const endX=
    startX+
    Math.ceil(canvas.width/TILE)+2;

    const startY=
    Math.floor(cameraY/TILE)-1;

    const endY=
    startY+
    Math.ceil(canvas.height/TILE)+2;


    for(
        let y=startY;
        y<endY;
        y++
    ){

        for(
            let x=startX;
            x<endX;
            x++
        ){

            if(
                x>=0 &&
                x<WORLD_W &&
                y>=0 &&
                y<WORLD_H
            ){

                drawBlock(
                    world[y][x],
                    x*TILE-cameraX,
                    y*TILE-cameraY
                );
            }
        }
    }


    drawEnemies();

    drawPlayer();
}


/* =========================
   移動
========================= */

let keys={};


document.addEventListener(
"keydown",
e=>{

    keys[e.key.toLowerCase()]=true;

});


document.addEventListener(
"keyup",
e=>{

    keys[e.key.toLowerCase()]=false;

});


function move(){

    let dx=0;
    let dy=0;


    if(
        keys["a"]||
        keys["arrowleft"]
    ){
        dx=-.08;
    }


    if(
        keys["d"]||
        keys["arrowright"]
    ){
        dx=.08;
    }


    if(
        keys["w"]||
        keys["arrowup"]
    ){
        dy=-.08;
    }


    if(
        keys["s"]||
        keys["arrowdown"]
    ){
        dy=.08;
    }


    player.x+=dx;
    player.y+=dy;


    player.x=
    Math.max(
        1,
        Math.min(
            WORLD_W-2,
            player.x
        )
    );


    player.y=
    Math.max(
        1,
        Math.min(
            WORLD_H-2,
            player.y
        )
    );


    cameraX=
    player.x*TILE-
    canvas.width/2;

    cameraY=
    player.y*TILE-
    canvas.height/2;


    cameraX=
    Math.max(
        0,
        Math.min(
            WORLD_W*TILE-
            canvas.width,
            cameraX
        )
    );


    cameraY=
    Math.max(
        0,
        Math.min(
            WORLD_H*TILE-
            canvas.height,
            cameraY
        )
    );
}


/* =========================
   スマホボタン
========================= */

function hold(
    id,
    key
){

    const b=
    document.getElementById(id);


    b.addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            keys[key]=true;
        }
    );


    b.addEventListener(
        "pointerup",
        e=>{
            e.preventDefault();
            keys[key]=false;
        }
    );


    b.addEventListener(
        "pointercancel",
        ()=>{
            keys[key]=false;
        }
    );
}


hold("up","arrowup");
hold("down","arrowdown");
hold("left","arrowleft");
hold("right","arrowright");


/* =========================
   マウス・タップ位置
========================= */

function getTile(){

    const rect=
    canvas.getBoundingClientRect();


    const scaleX=
    canvas.width/rect.width;

    const scaleY=
    canvas.height/rect.height;


    const x=
    (window.event.clientX-
    rect.left)*scaleX+
    cameraX;


    const y=
    (window.event.clientY-
    rect.top)*scaleY+
    cameraY;


    return {

        x:Math.floor(x/TILE),

        y:Math.floor(y/TILE)
    };
}


/* =========================
   ブロックを壊す
========================= */

function breakBlock(){

    if(!window.event)return;


    const p=
    getTile();


    if(
        p.x<0 ||
        p.x>=WORLD_W ||
        p.y<0 ||
        p.y>=WORLD_H
    )return;


    const d=
    Math.hypot(
        p.x-player.x,
        p.y-player.y
    );


    if(d>4){

        message.textContent=
        "❌ 遠すぎる！";

        return;
    }


    if(
        world[p.y][p.x]!==0
    ){

        world[p.y][p.x]=0;

        blocks++;

        message.textContent=
        "⛏️ ブロックを壊した！";
    }
}


/* =========================
   ブロックを置く
========================= */

function placeBlock(){

    if(!window.event)return;


    const p=
    getTile();


    if(
        p.x<0 ||
        p.x>=WORLD_W ||
        p.y<0 ||
        p.y>=WORLD_H
    )return;


    const d=
    Math.hypot(
        p.x-player.x,
        p.y-player.y
    );


    if(d>4){

        message.textContent=
        "❌ 遠すぎる！";

        return;
    }


    if(
        world[p.y][p.x]===0 &&
        blocks>0
    ){

        world[p.y][p.x]=2;

        blocks--;

        message.textContent=
        "🧱 土ブロックを置いた！";
    }
}


/* =========================
   キャンバス操作
========================= */

canvas.addEventListener(
"pointerdown",
function(e){

    window.event=e;

    if(e.button===2){

        placeBlock();

    }else{

        breakBlock();
    }
});


canvas.addEventListener(
"contextmenu",
e=>{
    e.preventDefault();
});


/* =========================
   ボタン
========================= */

document.getElementById(
"breakBtn"
).addEventListener(
"pointerdown",
()=>{
    message.textContent=
    "⛏️ 壊したいブロックをタップ！";
});


document.getElementById(
"placeBtn"
).addEventListener(
"pointerdown",
()=>{
    message.textContent=
    "🧱 置きたい場所をタップ！";
});


/* =========================
   保存
========================= */

function saveGame(){

    localStorage.setItem(
        "blockWorld",
        JSON.stringify({
            world:world,
            player:player,
            blocks:blocks,
            dayTime:dayTime
        })
    );


    message.textContent=
    "💾 ゲームを保存した！";
}


function loadGame(){

    const data=
    localStorage.getItem(
        "blockWorld"
    );


    if(!data)return;


    const save=
    JSON.parse(data);


    world=save.world;

    player=save.player;

    blocks=save.blocks;

    dayTime=save.dayTime;
}


document.getElementById(
"saveBtn"
).onclick=saveGame;


loadGame();


/* =========================
   時間
========================= */

function updateTime(){

    dayTime++;

    if(dayTime>6000){

        dayTime=0;
    }


    const day=
    dayTime<3000;


    document.getElementById(
        "day"
    ).textContent=
    day?"昼":"夜";
}


/* =========================
   敵AI
========================= */

function updateEnemies(){

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const e=enemies[i];


        if(
            Math.abs(
                e.x-player.x
            )<10
        ){

            e.x+=
            e.x<player.x
            ?e.speed
            :-e.speed;
        }


        const d=
        Math.hypot(
            e.x-player.x,
            e.y-player.y
        );


        if(d<.7){

            player.hp-=.01;

            if(player.hp<=0){

                player.hp=0;

                message.textContent=
                "💀 ゲームオーバー！";
            }
        }
    }


    if(
        dayTime>3000 &&
        Math.random()<.003 &&
        enemies.length<8
    ){

        spawnEnemy();
    }
}


/* =========================
   UI
========================= */

function updateUI(){

    document.getElementById(
        "hp"
    ).textContent=
    Math.ceil(player.hp);


    document.getElementById(
        "blockCount"
    ).textContent=
    blocks;
}


/* =========================
   ゲームループ
========================= */

let timer=0;


function loop(){

    move();

    timer++;


    if(timer%10===0){

        updateTime();

        updateEnemies();

        updateUI();
    }


    drawWorld();


    requestAnimationFrame(
        loop
    );
}


loop();

</script>

</body>
</html>
```
