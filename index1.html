<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>アスレチック10000 DX</title>

<style>

*{
  box-sizing:border-box;
  user-select:none;
  touch-action:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

body{
  background:#87ceeb;
}

button{
  cursor:pointer;
}

/* =====================
   タイトル
===================== */

#titleScreen{
  position:fixed;
  inset:0;
  z-index:5000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:linear-gradient(#55c8ff,#e8fbff);
}

#titleScreen h1{
  font-size:42px;
  margin:8px;
  text-shadow:3px 3px white;
}

#titleScreen p{
  font-size:18px;
}

.menuButton{
  width:250px;
  padding:15px;
  margin:6px;

}

#startButton{
  background:#20a866;

  box-shadow:0 5px #12643b;
}

#shopButton{
  background:#ffca28;

}

}

.menuButton:active{
  transform:translateY(4px);
  box-shadow:0 1px #555;
}

/* =====================
   ゲーム
===================== */

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

#world{
  position:absolute;
  left:0;
  top:0;
  width:12000px;
  height:100%;
}

/* =====================
   プレイヤー
===================== */

#player{
  position:absolute;
  width:42px;
  height:52px;
  background:orange;
  border:4px solid #d87500;
  border-radius:12px;
  z-index:100;
}

#player::before{
  content:"🙂";
  position:absolute;
  font-size:27px;
  left:3px;
  top:3px;
}

/* =====================
   足場
===================== */

.platform{
  position:absolute;
  height:30px;
  background:#20a044;
  border:4px solid #116526;
  border-radius:6px;
}

/* =====================
   トゲ
===================== */

.spike{
  position:absolute;
  width:45px;
  height:35px;
  z-index:30;
}

.spike::after{
  content:"";
  position:absolute;
  left:0;
  top:0;
  border-left:22px solid transparent;
  border-right:22px solid transparent;
  border-bottom:35px solid red;
}

/* =====================
   コイン
===================== */

.coin{
  position:absolute;
  width:28px;
  height:28px;
  background:gold;
  border:4px solid #d89d00;
  border-radius:50%;
  z-index:40;
}

/* =====================
   ジャンプ台
===================== */

.spring{
  position:absolute;
  width:60px;
  height:20px;
  background:#29a9ff;
  border:4px solid #0767a5;
  border-radius:8px;
  z-index:35;
}

/* =====================
   敵
===================== */

.enemy{
  position:absolute;
  width:45px;
  height:45px;
  background:#8b2be2;
  border:4px solid #53108f;
  border-radius:50%;
  z-index:70;
}

.enemy::after{
  content:"👾";
  position:absolute;
  left:1px;
  top:-3px;
  font-size:33px;
}

/* =====================
   ゴール
===================== */

#goal{
  position:absolute;
  width:35px;
  height:110px;
  background:#333;
  z-index:60;
}

#goalFlag{
  position:absolute;
  left:30px;
  top:0;
  width:75px;
  height:45px;
  background:red;
  clip-path:polygon(
    0 0,
    100% 0,
    75% 50%,
    100% 100%,
    0 100%
  );
}

/* =====================
   情報
===================== */

#info{
  position:fixed;
  top:8px;
  left:8px;
  z-index:1000;
  color:white;
  background:rgba(0,0,0,.82);
  padding:9px 12px;
  border-radius:12px;
  font-size:14px;
}

/* =====================
   ショップ
===================== */

#shop{
  display:none;
  position:fixed;
  inset:0;
  z-index:6000;
  background:rgba(0,0,0,.78);
  justify-content:center;
  align-items:center;
}

#shopBox{
  width:min(430px,92vw);
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:22px;
  padding:20px;
  text-align:center;
}

.shopItem{
  background:#f1f1f1;
  border-radius:15px;
  padding:14px;
  margin:10px 0;
}

.shopItem button{
  border:0;
  border-radius:10px;
  padding:10px 18px;
  background:#20a866;
  color:white;
  font-weight:bold;
}

#closeShop{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  background:#555;
  color:white;
  font-size:18px;
}

/* =====================
   クリア
===================== */

#message{
  display:none;
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:3000;
  width:min(390px,90vw);
  padding:25px;
  text-align:center;
  background:rgba(0,0,0,.95);
  color:white;
  border-radius:22px;
}

#nextButton{
  border:0;
  border-radius:12px;
  padding:14px 24px;
  font-size:18px;
  background:#20a866;
  color:white;
}

/* =====================
   通知
===================== */

#toast{
  display:none;
  position:fixed;
  left:50%;
  top:80px;
  transform:translateX(-50%);
  z-index:4000;
  background:rgba(0,0,0,.9);
  color:white;
  padding:10px 18px;
  border-radius:12px;
}

/* =====================
   スマホ
===================== */

#controls{
  position:fixed;
  left:0;
  right:0;
  bottom:12px;
  display:flex;
  justify-content:space-between;
  padding:0 12px;
  z-index:1500;
}

.group{
  display:flex;
  gap:8px;
}

.control{
  width:65px;
  height:65px;
  border:0;
  border-radius:16px;
  background:rgba(0,0,0,.72);
  color:white;
  font-size:26px;
}

/* =====================
   花火
===================== */

#fireworks{
  display:none;
  position:fixed;
  inset:0;
  z-index:2500;
  pointer-events:none;
}

</style>
</head>


<body>


<!-- =====================
     タイトル
===================== -->

<div id="titleScreen">

  <h1>🏃 アスレチック10000 DX</h1>

    10000ステージを目指せ！

  <button

<div id="game">

  <div id="world">

    <div id="player"></div>

      <div id="goalFlag"></div>

<!-- =====================
     情報

<div id="info">

  🏃 <span id="stage">1</span>/10000

 　❤️ <span id="hp">3</span>

 　🪙 <span id="coins">0</span>

 　⭐ <span id="score">0</span>

 　💰 <span id="money">0</span>

</div>

<div id="shop">

  <div id="shopBox">

    <h2>🛒 パワーアップショップ</h2>

    <p>
      💰 コイン：
      <span id="shopMoney">0</span>
    </p>


    <div class="shopItem">

      <h3>⚡ スピードアップ</h3>

      <p>
        移動速度が上がる！
      </p>

      <button
        id="speedBuy">
        100コイン
      </button>

    <div class="shopItem">

      <h3>❤️ ハートアップ</h3>

      <p>

      </p>

        id="hpBuy">

      </button>

    <div class="shopItem">

      <h3>🪽 二段ジャンプ</h3>

      <p>

      </p>

      <button
        id="doubleBuy">

      </button>

    </div>


    <div class="shopItem">

      <h3>💨 ダッシュ強化</h3>

      <p>
        ダッシュ距離が増える！
      </p>

        id="dashBuy">

    </button>

</div>

<div id="message">

  <h1 id="messageTitle">
    🎉 クリア！
  </h1>

  <p id="messageText"></p>

  <button id="nextButton">
    次のステージ ▶
  </button>

</div>


<!-- =====================
     花火
===================== -->

<canvas id="fireworks"></canvas>


<!-- =====================
     操作
===================== -->

<div id="controls">

  <div class="group">

    <button
      class="control"
      id="leftButton">
      ◀
    </button>

    <button
      class="control"
      id="rightButton">
      ▶
    </button>

  </div>


  <div class="group">

    <button
      class="control"
      id="dashButton">
      ⚡
    </button>

    <button
      class="control"
      id="jumpButton">
      ▲
    </button>

</div>


<script>

/* =====================
   HTML取得
===================== */

const world=
document.getElementById("world");

const player=
document.getElementById("player");

const goal=
document.getElementById("goal");

const titleScreen=
document.getElementById("titleScreen");

const startButton=
document.getElementById("startButton");

const resetButton=
document.getElementById("resetButton");

const shopButton=
document.getElementById("shopButton");

const shop=
document.getElementById("shop");

const closeShop=
document.getElementById("closeShop");

const stageText=
document.getElementById("stage");

const hpText=
document.getElementById("hp");

const coinsText=
document.getElementById("coins");

const scoreText=
document.getElementById("score");

const moneyText=
document.getElementById("money");

const shopMoney=
document.getElementById("shopMoney");

const message=
document.getElementById("message");

const messageTitle=
document.getElementById("messageTitle");

const messageText=
document.getElementById("messageText");

const nextButton=
document.getElementById("nextButton");

const toast=
document.getElementById("toast");

const fireworks=
document.getElementById("fireworks");

const ctx=
fireworks.getContext("2d");


/* =====================
   セーブ
===================== */

let stage=
Number(
localStorage.getItem("stage")
)||1;

let coins=
Number(
localStorage.getItem("coins")
)||0;

let score=
Number(
localStorage.getItem("score")
)||0;

let deaths=
Number(
localStorage.getItem("deaths")
)||0;

let speedLevel=
Number(
localStorage.getItem("speedLevel")
)||0;

let maxHP=
Number(
localStorage.getItem("maxHP")
)||3;

let doubleJump=
localStorage.getItem(
"doubleJump"
)==="true";

let dashLevel=
Number(
localStorage.getItem("dashLevel")
)||0;


/* =====================
   プレイヤー
===================== */

let x=100;

let y=400;

let vx=0;

let vy=0;

let onGround=false;

let jumpsUsed=0;

let hp=maxHP;

let gamePaused=true;

let leftPressed=false;

let rightPressed=false;

let dashPressed=false;

let dashCooldown=false;

let stageWidth=2500;

const gravity=.7;

const jumpPower=14;

const ground=500;


/* =====================
   配列
===================== */

let platforms=[];

let spikes=[];

let coinObjects=[];

let springs=[];

let enemies=[];


/* =====================
   当たり判定
===================== */

function hit(a,b){

return(

a.x<b.x+b.w&&
a.x+a.w>b.x&&
a.y<b.y+b.h&&
a.y+a.h>b.y

);

}


/* =====================
   ランダム
===================== */

function random(seed){

const n=
Math.sin(
seed*9999.91+
stage*123.45
)*43758.5453;

return n-Math.floor(n);

}


/* =====================
   ステージ生成
===================== */

function createStage(){

world.innerHTML="";

world.appendChild(player);

world.appendChild(goal);

platforms=[];
spikes=[];
coinObjects=[];
springs=[];
enemies=[];


stageWidth=
Math.min(
2500+stage*30,
9000
);


addPlatform(
0,
ground,
stageWidth+500,
30
);


const difficulty=
Math.min(
1+Math.floor(stage/10),
25
);


let px=250;

let py=420;

let index=0;


while(
px<stageWidth-400
){

px+=
120+
random(index+1)*
Math.min(
170,
90+difficulty*4
);


py+=
(random(index+20)-.5)*
Math.min(
180,
70+difficulty*5
);


py=
Math.max(
250,
Math.min(
py,
450
)
);


const width=
Math.max(
100,
220-difficulty*3
);


addPlatform(
px,
py,
width,
30
);


/* トゲ */

if(
random(index+50)<
Math.min(
.25+difficulty*.015,
.6
)
){

addSpike(
px+width/2-22,
py-35
);

}


/* コイン */

if(
random(index+100)<.9
){

addCoin(
px+width/2-14,
py-60
);

}


/* ジャンプ台 */

if(
random(index+150)<
Math.min(
.08+difficulty*.01,
.3
)
){

addSpring(
px+width/2-30,
py-20
);

}


/* 敵 */

if(
stage>=2 &&
random(index+200)<
Math.min(
.12+difficulty*.025,
.55
)
){

addEnemy(
px+width/2-22,
py-45
);

}


index++;

}


/* スタート */

addPlatform(
300,
400,
200,
30
);


/* ゴール */

goal.style.left=
stageWidth-180+"px";

goal.style.top=
ground-110+"px";


hp=maxHP;

resetPlayer();


stageText.textContent=stage;

hpText.textContent=hp;

coinsText.textContent=coins;

scoreText.textContent=score;

moneyText.textContent=coins;

}


/* =====================
   足場
===================== */

function addPlatform(px,py,w,h){

const el=
document.createElement("div");

el.className="platform";

el.style.left=px+"px";

el.style.top=py+"px";

el.style.width=w+"px";

el.style.height=h+"px";

world.appendChild(el);


platforms.push({
x:px,
y:py,
w:w,
h:h
});

}


/* =====================
   トゲ
===================== */

function addSpike(px,py){

const el=
document.createElement("div");

el.className="spike";

el.style.left=px+"px";

el.style.top=py+"px";

world.appendChild(el);


spikes.push({
x:px,
y:py,
w:45,
h:35
});

}


/* =====================
   コイン
===================== */

function addCoin(px,py){

const el=
document.createElement("div");

el.className="coin";

el.style.left=px+"px";

el.style.top=py+"px";

world.appendChild(el);


coinObjects.push({

x:px,
y:py,
w:28,
h:28,

element:el,

collected:false

});

}


/* =====================
   ジャンプ台
===================== */

function addSpring(px,py){

const el=
document.createElement("div");

el.className="spring";

el.style.left=px+"px";

el.style.top=py+"px";

world.appendChild(el);


springs.push({
x:px,
y:py,
w:60,
h:20
});

}


/* =====================
   敵
===================== */

function addEnemy(px,py){

const el=
document.createElement("div");

el.className="enemy";

el.style.left=px+"px";

el.style.top=py+"px";

world.appendChild(el);


enemies.push({

x:px,
y:py,

w:45,
h:45,

element:el,

startX:px,

direction:
random(px)>.5?1:-1,

speed:
Math.min(
1+stage*.01,
3
),

distance:
Math.min(
80+stage*2,
250
),

dead:false

});

}


/* =====================
   リセット
===================== */

function resetPlayer(){

x=100;

y=400;

vx=0;

vy=0;

onGround=false;

jumpsUsed=0;

}


/* =====================
   ジャンプ
===================== */

function jump(){

if(gamePaused)
return;


if(onGround){

vy=-jumpPower;

onGround=false;

jumpsUsed=1;

return;

}


if(
doubleJump &&
jumpsUsed<2
){

vy=-jumpPower;

jumpsUsed++;

}

}


/* =====================
   ダッシュ
===================== */

function dash(){

if(
gamePaused||
dashCooldown
)
return;


dashCooldown=true;


let direction=1;


if(leftPressed)
direction=-1;

else if(rightPressed)
direction=1;


x+=
direction*
(120+dashLevel*60);


showToast("⚡ ダッシュ！");


setTimeout(
()=>{
dashCooldown=false;
},
700
);


/* 壁外防止 */

if(x<0)
x=0;

if(x>stageWidth)
x=stageWidth;

}


/* =====================
   ダメージ
===================== */

function damage(){

if(gamePaused)
return;


hp--;

hpText.textContent=hp;


player.style.background="red";


setTimeout(
()=>{
player.style.background="orange";
},
200
);


if(hp<=0){

deaths++;

localStorage.setItem(
"deaths",
deaths
);

hp=maxHP;

resetPlayer();

showToast(
"💥 やられた！"
);

}
else{

vy=-8;

}

}


/* =====================
   コイン取得
===================== */

function collectCoins(){

const box={
x:x,
y:y,
w:42,
h:52
};


for(
const coin of coinObjects
){

if(
coin.collected
)
continue;


if(
hit(box,coin)
){

coin.collected=true;

coin.element.remove();

coins++;

score+=100;


coinsText.textContent=coins;

scoreText.textContent=score;

moneyText.textContent=coins;


save();


showToast(
"🪙 +100！"
);

}

}

}


/* =====================
   敵更新
===================== */

function updateEnemies(){

const box={
x:x,
y:y,
w:42,
h:52
};


for(
const enemy of enemies
){

if(enemy.dead)
continue;


enemy.x+=
enemy.direction*
enemy.speed;


if(
enemy.x>
enemy.startX+
enemy.distance
){

enemy.direction=-1;

}


if(
enemy.x<
enemy.startX-
enemy.distance
){

enemy.direction=1;

}


enemy.element.style.left=
enemy.x+"px";


if(
hit(box,enemy)
){

if(
vy>0 &&
y+52<
enemy.y+20
){

enemy.dead=true;

enemy.element.remove();

vy=-10;

score+=300;

scoreText.textContent=score;

save();

showToast(
"👾 敵を倒した！ +300"
);

}
else{

damage();

}

}

}

}


/* =====================
   ゴール
===================== */

function checkGoal(){

const box={
x:x,
y:y,
w:42,
h:52
};


const goalBox={
x:
parseInt(goal.style.left),

y:
parseInt(goal.style.top),

w:35,
h:110
};


if(
hit(box,goalBox)
){

clearStage();

}

}


/* =====================
   クリア
===================== */

function clearStage(){

if(gamePaused)
return;


gamePaused=true;


score+=
stage*100;


scoreText.textContent=score;


if(stage>=10000){

messageTitle.innerHTML=
"🏆🎉<br>10000クリア！！";


messageText.innerHTML=
"🌟 完全クリア！！ 🌟"+
"<br><br>"+
"⭐ スコア："+score+
"<br>"+
"🪙 コイン："+coins+
"<br><br>"+
"🎆 おめでとう！！";


nextButton.textContent=
"🎉 もう一度見る";


message.style.display=
"block";


startFireworks();


}
else{

messageTitle.textContent=
"🎉 ステージクリア！";


messageText.textContent=
"ステージ "+
stage+
" クリア！";


nextButton.textContent=
"次のステージ ▶";


message.style.display=
"block";


}

save();

}


/* =====================
   次のステージ
===================== */

nextButton.addEventListener(
"click",
()=>{

if(stage>=10000){

return;

}


stage++;

save();

message.style.display=
"none";

gamePaused=false;

createStage();

});


/* =====================
   ショップ
===================== */

function updateShop(){

shopMoney.textContent=coins;

moneyText.textContent=coins;

}


/* スピード */

document.getElementById(
"speedBuy"
).addEventListener(
"click",
()=>{

if(coins<100){

showToast(
"💰 コインが足りない！"
);

return;

}


coins-=100;

speedLevel++;

save();

updateShop();

showToast(
"⚡ スピードアップ！"
);

});


/* HP */

document.getElementById(
"hpBuy"
).addEventListener(
"click",
()=>{

if(coins<200){

showToast(
"💰 コインが足りない！"
);

return;

}


coins-=200;

maxHP++;

save();

updateShop();

showToast(
"❤️ HPアップ！"
);

});


/* 二段ジャンプ */

document.getElementById(
"doubleBuy"
).addEventListener(
"click",
()=>{

if(doubleJump){

showToast(
"🪽 もう持ってる！"
);

return;

}


if(coins<500){

function updatePhysics(){

if(gamePaused)
return;


/* スピード */

const speed=
5+
speedLevel*1.2;


/* 移動 */

if(leftPressed)
vx=-speed;

else if(rightPressed)
vx=speed;

else
vx=0;


x+=vx;


/* 重力 */

vy+=gravity;

y+=vy;


onGround=false;


const bottom=
y+52;


/* 足場 */

for(
const p of platforms
){

const horizontal=
x+42>p.x &&
x<p.x+p.w;


const falling=
vy>=0;


const crossed=
bottom>=p.y &&
bottom<=p.y+35;


if(
horizontal&&
falling&&
crossed
){

y=
p.y-52;

vy=0;

onGround=true;

jumpsUsed=0;

}

}


/* ジャンプ台 */

const box={
x:x,
y:y,
w:42,
h:52
};


for(
const spring of springs
){

if(
hit(box,spring)
){

vy=-21;

onGround=false;

}

}


/* トゲ */

for(
const spike of spikes
){

if(
hit(box,spike)
){

damage();

return;

}

}


collectCoins();

updateEnemies();

checkGoal();


/* 落下 */

if(y>800){

damage();

return;

}


/* 範囲 */

if(x<0)
x=0;

if(x>stageWidth)
x=stageWidth;

}

);

let particles=[];

window.innerWidth;

window.innerHeight;

resizeFireworks
);


function createFirework(){

const cx=
Math.random()*
fireworks.width;

const cy=
80+
Math.random()*
fireworks.height*.55;


for(
let i=0;
i<70;
i++
){

const angle=
Math.random()*
Math.PI*2;

const speed=
2+
Math.random()*6;


particles.push({

x:cx,

y:cy,

vx:
Math.cos(angle)*
speed,

vy:
Math.sin(angle)*
speed,

life:80

});

}

}


function startFireworks(){

fireworks.style.display=
"block";

resizeFireworks();


function animate(time){

ctx.clearRect(
0,
0,
fireworks.width,
fireworks.height
);


if(
time-lastFirework>450
){

createFirework();

lastFirework=time;

}


for(
let i=particles.length-1;
i>=0;
i--
){

const p=
particles[i];


p.x+=p.vx;

p.y+=p.vy;

p.vy+=.08;

p.life--;


ctx.globalAlpha=
Math.max(
0,
p.life/80
);


ctx.beginPath();

ctx.arc(
p.x,
p.y,
4,
0,
Math.PI*2
);

ctx.fill();


if(p.life<=0){

particles.splice(
i,
1
);

}

}


ctx.globalAlpha=1;


requestAnimationFrame(
animate
);

}


requestAnimationFrame(
animate
);

}
